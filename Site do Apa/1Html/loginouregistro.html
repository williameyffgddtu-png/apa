<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Nocturne - Registro</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../2CSS/loginouregistro.css">
</head>

<body>
    <canvas id="cv"></canvas>

    <header>
        <div class="logo"><canvas id="lg" width="7" height="7"></canvas>Nocturne</div>
        <div class="act">
            <!-- o JS coloca aqui o link da página de onde o usuário veio -->
            <a class="btn alt" id="bk" href="pagina inicial.html">&larr; Voltar</a>
        </div>
    </header>

    <main class="wrap">
        <!-- A coruja, as videiras (flores azuis / abóboras) e o cenário são criados pelo JS -->
        <section class="card" id="card" data-m="reg">
            <div class="tabs">
                <button type="button" class="tab on" data-m="reg">Cadastrar</button>
                <button type="button" class="tab" data-m="log">Entrar</button>
            </div>

            <h2 id="ttl">Crie sua conta</h2>
            <p class="hint" id="hint">Registre-se para escrever suas notas da noite.</p>

            <form id="frm" novalidate>
                <div class="fld only-reg">
                    <label for="nome">Nome</label>
                    <input id="nome" maxlength="24" autocomplete="nickname" placeholder="Como te chamamos?">
                </div>
                <div class="fld">
                    <label for="email">E-mail</label>
                    <input id="email" type="email" maxlength="60" autocomplete="email" placeholder="voce@email.com">
                </div>
                <div class="fld">
                    <label for="senha">Senha</label>
                    <div class="pw">
                        <input id="senha" type="password" maxlength="40" autocomplete="new-password" placeholder="Mínimo 6 caracteres">
                        <button type="button" class="eye" data-for="senha" aria-label="Mostrar senha">ver</button>
                    </div>
                </div>
                <div class="fld only-reg">
                    <label for="senha2">Confirmar senha</label>
                    <div class="pw">
                        <input id="senha2" type="password" maxlength="40" autocomplete="new-password" placeholder="Repita a senha">
                        <button type="button" class="eye" data-for="senha2" aria-label="Mostrar senha">ver</button>
                    </div>
                </div>

                <p class="err" id="err" role="alert"></p>
                <button class="go" id="go" type="submit">Criar conta</button>
            </form>

            <p class="sw"><span id="swt">Já tem conta?</span> <button type="button" id="swb">Entrar</button></p>
        </section>
    </main>

    <script src="../3Js/loginouregistro.js"></script>
</body>

</html>
